name: "Build Android APK"
on: [push, pull_request]

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          cp -r /root/.local/share/godot/templates/4.2.1.stable/* ~/.local/share/godot/export_templates/4.2.1.stable/
      - name: Android Export
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/my-merge-game.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-game-apk
          path: build/android/*.apk
